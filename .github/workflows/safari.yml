name: Remaining accessibility checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m venv /tmp/meda-venv && /tmp/meda-venv/bin/pip install selenium
      - run: sudo safaridriver --enable
      - run: /tmp/meda-venv/bin/python remaining.py
  iphone:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          brew list xcodegen || brew install xcodegen
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS-27")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl openurl "$DEVICE" https://dev.blackhaven-industries.pages.dev/demo/meda/staff/
          cd ios
          xcodegen generate
          xcodebuild test -scheme SafariSpeech -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO

name: Safari VoiceOver
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  safari:
    strategy:
      fail-fast: false
      matrix:
        check: [community, rental]
    env:
      CHECK: ${{ matrix.check }}
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-save @guidepup/guidepup@0.40.0
      - run: npx --yes @guidepup/setup@0.29.3 setup --ci
      - run: npx --yes @guidepup/setup@0.29.3 install
      - run: node site.mjs


      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: safari-${{ matrix.check }}
          path: '*.png'



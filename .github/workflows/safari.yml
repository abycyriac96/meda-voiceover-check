name: Remaining accessibility checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m venv /tmp/meda-venv && /tmp/meda-venv/bin/pip install selenium
      - run: sudo safaridriver --enable
      - run: /tmp/meda-venv/bin/python remaining.py
  iphone:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - run: |
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl help ui
          xcrun simctl help accessibility || true

